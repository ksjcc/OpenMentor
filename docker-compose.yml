services:
  app:
    build:
      context: .
    ports:
      - "8080:8080"
    env_file:
      - .env
    depends_on:
      - postgres
      - redis
      - mysql

mysql:
  image: mysql:8.4
  ports:
    - "3306:3306"
  environment:
    MYSQL_DATABASE: career_mind
    MYSQL_ROOT_PASSWORD: 12345
  volumes:
    - mysql_data:/var/lib/mysql
volumes:
  mysql_data:
redis:
  image: redis:7-alpine
  ports:
    - "6379:6379"
