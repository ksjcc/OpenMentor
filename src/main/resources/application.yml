spring:
  application:
    name: agent-career

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${MYSQL_HOST:127.0.0.1}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:career_mind}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:12345}

  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest
    virtual-host: /

  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DATABASE:0}
      timeout: ${REDIS_TIMEOUT:5s}
      connect-timeout: ${REDIS_CONNECT_TIMEOUT:5s}
      client-type: lettuce
      lettuce:
        shutdown-timeout: 100ms

mybatis:
  mapper-locations: classpath*:mapper/**/*.xml
  type-aliases-package: com.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
  group-configs:
    - group: career-mind
      display-name: CareerMind API
      paths-to-match: /api/**
      packages-to-scan: com.controller

knife4j:
  enable: true
  setting:
    language: zh_cn

server:
  port: 8080

langchain4j:
  open-ai:
    chat-model:
      api-key: ${DASHSCOPE_API_KEY:}
      base-url: https://dashscope.aliyuncs.com/compatible-mode/v1
      model-name: qwen-plus
      temperature: 0.7
    embedding-model:
      api-key: ${DASHSCOPE_API_KEY:}
      base-url: https://dashscope.aliyuncs.com/compatible-mode/v1
      model-name: ${AI_EMBEDDING_MODEL:bge-m3}
      dimensions: ${AI_EMBEDDING_DIMENSIONS:1024}

vector-store:
  pg:
    url: jdbc:postgresql://${PGVECTOR_HOST:127.0.0.1}:${PGVECTOR_PORT:5432}/${PGVECTOR_DATABASE:career_vector}
    username: ${PGVECTOR_USERNAME:postgres}
    password: ${PGVECTOR_PASSWORD:12345}
    table: ${PGVECTOR_TABLE:memory_vector}
    dimension: ${AI_EMBEDDING_DIMENSIONS:1024}
    min-score: ${PGVECTOR_MIN_SCORE:0.6}
    initialize-schema: ${PGVECTOR_INITIALIZE_SCHEMA:true}

graphrag:
  budget:
    retriever-calls: 3
    graph-hop: 2
    chunk-limit: 12
    llm-calls: 2
