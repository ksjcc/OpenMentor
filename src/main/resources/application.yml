spring:
  application:
    name: agent-career

  # 本地填 key 的方式：把 .env.example 复制成 .env 填好，这里会把它当作
  # properties 文件读进来（optional: 表示文件不存在也不报错）。
  config:
    import: optional:file:./.env[.properties]

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${MYSQL_HOST:127.0.0.1}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:career_mind}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:12345}

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    virtual-host: ${RABBITMQ_VHOST:/}
    connection-timeout: ${RABBITMQ_CONNECTION_TIMEOUT:3s}
    listener:
      simple:
        # 本机没有 RabbitMQ 时设为 false：不启动消费者，日志就不会每 5 秒刷一次
        # "Attempting to connect to: [localhost:5672]" / "Failed to check/redeclare auto-delete queue(s)"。
        # 代价只是面试结束后的闪卡/画像合并/图谱索引不会自动生成（会话状态停在 PENDING），
        # 面试本身、复盘报告、复习训练都不受影响。
        auto-startup: ${RABBITMQ_LISTENER_ENABLED:true}

  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DATABASE:0}
      timeout: ${REDIS_TIMEOUT:5s}
      connect-timeout: ${REDIS_CONNECT_TIMEOUT:5s}
      client-type: lettuce
      lettuce:
        shutdown-timeout: 100ms

mybatis:
  mapper-locations: classpath*:mapper/**/*.xml
  type-aliases-package: com.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
  group-configs:
    - group: career-mind
      display-name: CareerMind API
      paths-to-match: /api/**
      packages-to-scan: com.controller

knife4j:
  enable: true
  setting:
    language: zh_cn

server:
  port: 8080

langchain4j:
  open-ai:
    chat-model:
      # 简历解析 / 评分 / 知识提炼 / 学习计划 用的 chat 模型。
      # 默认阿里云百炼（dashscope）qwen-plus；只有 DeepSeek key 时，
      # 把 AI_CHAT_BASE_URL / AI_CHAT_MODEL 指到 DeepSeek 即可（见 .env.example）。
      # api-key：优先 DASHSCOPE_API_KEY，没填时复用 AGENTSCOPE 的 key。
      api-key: ${DASHSCOPE_API_KEY:${AGENTSCOPE_MODEL_API_KEY:}}
      base-url: ${AI_CHAT_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode/v1}
      model-name: ${AI_CHAT_MODEL:qwen-plus}
      temperature: 0.7
    embedding-model:
      # 向量检索用的 embedding。DeepSeek 没有 embedding 接口，
      # 只配 DeepSeek 时这里会失败（RAG 向量召回降级，不影响面试与复盘）。
      api-key: ${DASHSCOPE_API_KEY:${AGENTSCOPE_MODEL_API_KEY:}}
      base-url: ${AI_EMBEDDING_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode/v1}
      model-name: ${AI_EMBEDDING_MODEL:bge-m3}
      dimensions: ${AI_EMBEDDING_DIMENSIONS:1024}

# ============================================================================
# 面试官 harness（agentscope）用的模型。
#
# 项目里有【两套】模型客户端，key 不是同一个：
#   1. langchain4j（上面 langchain4j.open-ai.*）→ 简历解析、评分、知识提炼
#   2. agentscope（这里）→ 面试官本体，负责出题/追问/调用工具
#
# 默认指向 DeepSeek；换别的 OpenAI 兼容服务只改下面三项即可，例如阿里云百炼：
#   api-key: 你的 dashscope key
#   base-url: https://dashscope.aliyuncs.com/compatible-mode/v1
#   name: qwen-plus
# ============================================================================
agentscope:
  model:
    # 没配 AGENTSCOPE_MODEL_API_KEY 时退回 DEEPSEEK_API_KEY
    api-key: ${AGENTSCOPE_MODEL_API_KEY:${DEEPSEEK_API_KEY:}}
    base-url: ${AGENTSCOPE_MODEL_BASE_URL:https://api.deepseek.com/v1}
    name: ${AGENTSCOPE_MODEL_NAME:deepseek-chat}

vector-store:
  pg:
    # false = 完全关闭向量检索：不建表、不调 embedding、不写库。
    # 本机没有 pgvector 时设为 false，记忆只落 MySQL，面试/复盘/复习都不受影响。
    enabled: ${VECTOR_STORE_ENABLED:true}
    url: jdbc:postgresql://${PGVECTOR_HOST:127.0.0.1}:${PGVECTOR_PORT:5432}/${PGVECTOR_DATABASE:career_vector}
    username: ${PGVECTOR_USERNAME:postgres}
    password: ${PGVECTOR_PASSWORD:12345}
    table: ${PGVECTOR_TABLE:memory_vector}
    dimension: ${AI_EMBEDDING_DIMENSIONS:1024}
    min-score: ${PGVECTOR_MIN_SCORE:0.6}
    initialize-schema: ${PGVECTOR_INITIALIZE_SCHEMA:true}

graphrag:
  budget:
    retriever-calls: 3
    graph-hop: 2
    chunk-limit: 12
    llm-calls: 2
interview:
  guard:
    # 单实例同时进行的 harness 调用上限，按模型侧并发配额 / CPU 核数定
    max-concurrent: 16
    # 拿不到并发许可时最多等多久，超过就直接降级（面试场景不建议长排队）
    concurrency-wait-ms: 200
  breaker:
    window-size: 20          # 滑动窗口
    min-samples: 8           # 样本不足不熔断，避免冷启动误判
    failure-rate: 0.5        # 失败率超过 50%
    open-duration-ms: 30000  # 打开 30 秒后放一个探测请求
  idempotency:
    # 在途锁 TTL：要覆盖"创建 + 出第一题"的最长耗时（含模型调用）
    lock-ttl-seconds: 60
    # 显式 Idempotency-Key 的结果缓存：可安全放长
    explicit-result-ttl-seconds: 300
    # 无键时按参数哈希去重：只覆盖连点
    implicit-result-ttl-seconds: 10